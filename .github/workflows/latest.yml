name: Latest

# Every push to 335 publishes the rolling Latest release with Questie-335-latest.zip,
# an installer that downloads this exact commit from GitHub and verifies it,
# built and checked by the assembly's shared addon workflow.
# The previous assets stay downloadable until the new installer is checked.
on:
  push:
    branches: [335]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest
  cancel-in-progress: false

jobs:
  latest:
    uses: Syntax555/mod-playerbots-portable/.github/workflows/addon-latest.yml@main
    with:
      asset: Questie-335-latest.zip
      installer-name: Questie-335
      installer-path: .
      installer-short: Questie
      installer-title: Questie
